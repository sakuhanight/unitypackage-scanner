name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            package_cmd: package:win
            artifact_pattern: "*.exe"
          - os: macos-latest
            platform: macos
            package_cmd: package:mac
            artifact_pattern: "*.dmg"
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
      
      - name: Code quality checks
        uses: ./.github/actions/quality-checks
        with:
          continue-on-error: 'true'
      
      - name: Build application
        run: pnpm build
      
      - name: Package application
        run: pnpm run ${{ matrix.package_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.platform }}
          path: release/
          retention-days: 1

  create-release:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts/

      - name: Prepare release files
        run: |
          mkdir -p release-final
          find artifacts/ -name "*.exe" -o -name "*.dmg" -o -name "*.blockmap" | xargs -I {} cp {} release-final/
          ls -la release-final/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-final/*
          body: |
            ## ゆにぱけスキャナー ${{ github.ref_name }}

            **マルチプラットフォームリリース**

            ### サポートプラットフォーム
            - Windows 10以降（64bit）
            - macOS 10.15以降（64bit）

            ### インストール方法

            **Windows**
            - `unitypackage-scanner-*.exe` をダウンロードして実行

            **macOS**  
            - `unitypackage-scanner-*.dmg` をダウンロードして開き、Applicationsフォルダにドラッグ

            ### 主な変更点
            自動生成されたリリースノートを参照してください。
          generate_release_notes: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}