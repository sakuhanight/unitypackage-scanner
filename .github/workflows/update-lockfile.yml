name: Update pnpm lockfile

on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

jobs:
  update-lockfile:
    if: github.actor == 'dependabot[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Configure Git for HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf [email protected]:
          git config --global url."https://".insteadOf git://
          git config --global url."https://".insteadOf ssh://

      - name: Install dependencies and update lockfile
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --frozen-lockfile=false

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated lockfile
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add pnpm-lock.yaml
          git commit -m "chore: update pnpm-lock.yaml with HTTPS URLs"
          git push

  pr-check:
    needs: update-lockfile
    if: (github.actor == 'dependabot[bot]' || github.event_name == 'workflow_dispatch') && needs.update-lockfile.result == 'success'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout updated code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
      
      - name: Code quality checks
        uses: ./.github/actions/quality-checks
        with:
          continue-on-error: 'true'

  ci-test:
    needs: update-lockfile
    if: (github.actor == 'dependabot[bot]' || github.event_name == 'workflow_dispatch') && needs.update-lockfile.result == 'success'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout updated code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
      
      - name: Code quality checks
        uses: ./.github/actions/quality-checks
        with:
          continue-on-error: 'true'
      
      - name: Build
        run: pnpm build